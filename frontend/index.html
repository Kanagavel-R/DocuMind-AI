
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DocuMind AI</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>My Document Assistant</h1>

    <p id="p1">Upload your PDF and ask questions</p>

    <form>
        <div class="container">

            <div class="form-group">
                <label for="pdf">Upload PDF</label>
                <input type="file" id="pdf" accept=".pdf">
            </div>

            <div class="form-group">
                <label for="question">Ask Question</label>
                <input
                    type="text"
                    id="question"
                    placeholder="Ask your question"
                >
            </div>

            <div class="form-group">
                <button type="submit" id="getAnswerBtn">Get Answer</button>
            </div>

        </div>
    </form>
    <div id="result"></div>
    <script src="script.js"></script>
</body>
</html>
